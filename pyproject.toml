[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verl"
dynamic = ["version"]
description = "S3: You Don't Need That Much Data to Train a Search Agent via RL"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "accelerate==1.4.0",
    "codetiming==1.4.0",
    "datasets==3.3.2",
    "dill==0.3.8",
    "flash-attn==2.7.4.post1; sys_platform == 'linux'",
    "hydra-core==1.3.2",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pybind11==2.6.1",
    "ray==2.43.0",
    "tensordict<0.6",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "transformers==4.47.1",
    "pyairports",
    "setuptools<81",
    "uvloop==0.21.0",
    "vllm==0.6.3; sys_platform == 'linux'",
    "wandb==0.19.8",
    "ipython==8.18.1",
    "matplotlib==3.9.4",
    "huggingface-hub==0.29.2",
    "faiss-cpu==1.8.0.post1",
    "fastapi==0.115.11",
    "uvicorn==0.34.0",
    "pyserini==0.22.1",
    # Pin the spaCy stack (pulled in by pyserini) to versions with prebuilt
    # cp39 wheels; newer blis (1.3.x) has no cp39 wheel and needs Python headers.
    "spacy==3.8.3",
    "thinc==8.3.4",
    "blis==1.2.0",
]

[project.optional-dependencies]
test = ["pytest", "yapf"]

[tool.setuptools.dynamic]
version = { file = "verl/version/version" }

[tool.setuptools.packages.find]
where = ["."]
include = ["verl*", "s3*", "generator_llms*", "utils*"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1%2Bcu12torch2.4cxx11abiFALSE-cp39-cp39-linux_x86_64.whl", marker = "sys_platform == 'linux'" }
# PyPI only ships an empty placeholder for `pyairports` (0.0.1). vLLM/outlines
# import `pyairports.airports.AIRPORT_LIST`, so pull the real module from source.
pyairports = { git = "https://github.com/NICTA/pyairports.git" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
